[workspace]
resolver = "2"
members = [
    "projects/binding/binding.com",
    "projects/binding/binding.dbus",
    "projects/webview/webview",
    "projects/webview/webview.types",
    "projects/webview/webview.win32",
    "projects/webview/webview.macos",
    "projects/webview/webview.linux",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Aster <192607617@qq.com>"]
repository = "https://github.com/oovm/boost-binding.rs"
publish = false

[workspace.dependencies]
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
binding-com = { path = "projects/binding/binding.com", version = "0.0.1" }
binding-dbus = { path = "projects/binding/binding.dbus", version = "0.0.1" }
webview = { path = "projects/webview/webview", version = "0.0.1" }
webview-types = { path = "projects/webview/webview.types", version = "0.0.1" }
webview-win32 = { path = "projects/webview/webview.win32", version = "0.0.1" }
webview-macos = { path = "projects/webview/webview.macos", version = "0.0.1" }
webview-linux = { path = "projects/webview/webview.linux", version = "0.0.1" }

# 外部绑定依赖账本（每项均为对应平台系统库的 Rust 绑定，见 readme.md）
# Windows：WebView2 Loader / COM（系统自带 WebView2 Runtime）
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# macOS：Cocoa / WebKit（系统自带 WKWebView）
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSDate",
    "NSRunLoop",
    "NSGeometry",
    "NSObjCRuntime",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSEvent",
    "NSResponder",
    "NSGraphics",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKWebView",
    "WKWebViewConfiguration",
    "WKScriptMessage",
    "WKScriptMessageHandler",
    "WKNavigation",
    "block2",
] }

[profile.release]
lto = true
panic = "abort"
