[workspace]
resolver = "2"
members = [
    "compilers/*",
]
default-members = [
    "compilers/itools",
    "compilers/itools-core",
    "compilers/itools-macros",
    "compilers/itools-config",
    "compilers/itools-walker",
    "compilers/itools-localization",
]
[workspace.package]
version = "0.0.1"
authors = ["Aster <192607617@qq.com>"]
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/oovm/iTools"
repository = "https://github.com/oovm/iTools"
readme = "readme.md"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149" }
serde_yaml = { version = "0.9.34" }
toml = "1.0.7+spec-1.1.0"
crossterm = "0.29.0"
lru = "0.16"
tokio = { version = "1.50" }
futures = "0.3"

tracing = { version = "0.1.44" }
proc-macro2 = { version = "1.0.106" }
quote = { version = "1.0.45" }
syn = { version = "2.0.117", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
lazy_static = "1.5.0"

# iTools dependencies
itools = { path = "compilers/itools", version = "0.0.1" }
itools-core = { path = "compilers/itools-core", version = "0.0.1" }
itools-macros = { path = "compilers/itools-macros", version = "0.0.1" }
itools-config = { path = "compilers/itools-config", version = "0.0.1" }
itools-walker = { path = "compilers/itools-walker", version = "0.0.1" }
itools-localization = { path = "compilers/itools-localization", version = "0.0.1" }

# Oak parsers
oak-core = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.9" }
oak-toml = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.9" }
oak-yaml = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.9" }
oak-json = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.9" }
oak-glob = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.9" }
oak-fluent = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.9" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
