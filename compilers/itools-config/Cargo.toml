[package]
name = "itools-config"
version = "0.0.1"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = "https://github.com/oovm/iTools/tree/dev/compilers/itools-config"
description = "Configuration management for iTools"



[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
itools-macros = { workspace = true }
itools-localization = { workspace = true }
serde = { workspace = true, features = ["derive"] }
oak-json = { workspace = true, optional = true }
oak-toml = { workspace = true, optional = true }
oak-yaml = { workspace = true, optional = true }
lazy_static = { workspace = true }

[features]
default = ["json", "toml", "yaml"]
json = ["oak-json"]
toml = ["oak-toml"]
yaml = ["oak-yaml"]

[dev-dependencies]
assert_matches = "1.5"
criterion = "0.8"
figment = { version = "0.10", features = ["json", "toml", "yaml"] }
tempfile = "3.27"

[[bench]]
name = "merge_benchmark"
harness = false
