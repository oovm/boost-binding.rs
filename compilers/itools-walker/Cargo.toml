[package]
name = "itools-walker"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
homepage = "https://github.com/oovm/RustTemplate"
repository = "https://github.com/oovm/RustTemplate"
readme = "readme.md"
description = "Asynchronous directory walker for iTools"


[dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt", "rt-multi-thread"] }
futures = { workspace = true }

[features]
default = []
glob = ["oak-glob"]

[dependencies.oak-glob]
workspace = true
optional = true

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
