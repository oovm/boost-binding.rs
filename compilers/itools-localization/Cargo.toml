[package]
name = "itools-localization"
version = "0.0.1"
authors = { workspace = true }
edition = { workspace = true }
description = "Internationalization support for iTools"
homepage = { workspace = true }
repository = "https://github.com/oovm/iTools/tree/dev/compilers/itools-localization"
license = { workspace = true }

[dependencies]
lazy_static = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
oak-json = { workspace = true, optional = true }
oak-toml = { workspace = true, optional = true }
oak-yaml = { workspace = true, optional = true }
lru = { workspace = true }

# Oak Fluent support
oak-fluent = { workspace = true }

[features]
default = ["json", "toml", "yaml"]
json = ["oak-json"]
toml = ["oak-toml"]
yaml = ["oak-yaml"]

[dev-dependencies]
assert_matches = "1.5"
