lazy_static = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lru = { workspace = true }

# Oak Fluent support
oak-fluent = { path = "../../../oaks/examples/oak-fluent", optional = true }

[features]
default = []
oak-fluent = ["dep:oak-fluent"]

[dev-dependencies]
assert_matches = "1.5"
