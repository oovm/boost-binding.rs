[package]
name = "itools-notify"
version = "0.0.0"
edition = { workspace = true }
authors = { workspace = true }
description = "自研的文件系统变更通知库，不依赖外部 C 库"
homepage = { workspace = true }
repository = "https://github.com/oovm/iTools/tree/dev/compilers/itools-notify"
license = { workspace = true }

[dependencies]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winbase", "winerror", "handleapi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
