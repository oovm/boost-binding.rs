[package]
name = "itools-notify"
version = "0.1.0"
edition = "2021"
description = "自研的文件系统变更通知库，不依赖外部 C 库"
homepage = "https://github.com/yourusername/itools"
repository = "https://github.com/yourusername/itools"
license = "MIT"

[dependencies]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winbase", "winerror", "handleapi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
